name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-hygiene:
    name: Lint & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity watchfiles black pytest

      - name: Install just and taplo
        uses: taiki-e/install-action@v2
        with:
          tool: just,taplo

      - name: Run lint
        run: just lint

  test-python:
    name: Test Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity watchfiles pytest

      - name: Run Python backend tests
        env:
          AGY_BRIDGE_SKIP_LIVE_TESTS: "1"
        run: |
          cargo test --no-default-features --features python
          python -m pytest crates/agy-bridge/tests/python -q

  test-native-standalone:
    name: Test Native Backend (Pure Rust - No Python SDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Run Native backend tests without Python SDK installed
        env:
          AGY_BRIDGE_SKIP_LIVE_TESTS: "1"
        run: |
          cargo test --no-default-features --features native
