# Dev-only Python environment for this repository.
#
# The Rust crate is the product; this file exists purely so that `uv run` has a
# project to resolve against. It pins the tools the justfile shells out to
# (`black`, `pytest`) and the SDK that the `python` backend needs at runtime,
# so `just lint`/`just test` behave the same locally and in CI.
[project]
name = "agy-bridge-devtools"
version = "0.0.0"
description = "Dev-only tooling environment for the agy-bridge repository"
requires-python = ">=3.11"
dependencies = [
  # Needed by `cargo test --features python`: the embedded interpreter imports
  # `google.antigravity.*`, and the SDK pulls in `watchfiles` for triggers.
  "google-antigravity>=0.1.22",
  "watchfiles",
]

[dependency-groups]
dev = ["black>=24", "mypy>=2.4.0", "pytest>=8", "ruff>=0.16.10"]

[tool.uv]
# Not an installable package — just an environment.
package = false
# PyO3's `auto-initialize` links against the interpreter found at build time.
# Preferring system Python keeps CI aligned with actions/setup-python while
# still allowing uv-managed Python on Windows developer machines.
python-preference = "system"

[tool.black]
# The only Python we own lives in the crate; keep black off vendored trees.
extend-exclude = '''
/(
    \.venv
  | target
)/
'''

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "target"]

[tool.mypy]
python_version = "3.11"
exclude = ["^\\.venv/", "^target/"]
mypy_path = ["crates/agy-bridge/src/runtime/py"]

[[tool.mypy.overrides]]
module = [
  "google",
  "google.antigravity",
  "google.antigravity.*",
  "websockets.*",
]
ignore_missing_imports = true
