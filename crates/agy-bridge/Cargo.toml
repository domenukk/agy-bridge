[package]
name = "agy-bridge"
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
description = "Async Rust bridge and native runtime for the Google Antigravity SDK"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/domenukk/agy-bridge"
readme = "README.md"
keywords = ["gemini", "agent", "pyo3", "antigravity", "llm"]
categories = ["api-bindings", "asynchronous"]
exclude = [
  "AGENTS.md",
  ".agents/",
  ".recovered/",
  "blank.png",
  ".markdownlint.jsonc",
]

[dependencies]
llm-tool-macros.workspace = true
llm-tool.workspace = true
tokio.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
typed-builder.workspace = true
futures.workspace = true
tokio-stream.workspace = true

# python backend
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pythonize = { workspace = true, optional = true }

# native backend
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
pbjson = { workspace = true, optional = true }
pbjson-types = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }
pbjson-build = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
agy-bridge-test-support.workspace = true
tempfile.workspace = true
fast_rands.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints]
workspace = true

[features]
default = ["native"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "dep:pythonize"]
native = [
  "dep:prost",
  "dep:prost-types",
  "dep:pbjson",
  "dep:pbjson-types",
  "dep:tokio-tungstenite",
  "dep:prost-build",
  "dep:protoc-bin-vendored",
  "dep:pbjson-build",
  "dep:ureq",
  "dep:zip",
]
md-tmpl = ["llm-tool/md-tmpl"]

[[example]]
name = "getting_started_hello_world"
path = "examples/getting_started/hello_world.rs"

