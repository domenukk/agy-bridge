[workspace]
members = ["crates/agy-bridge", "crates/agy-bridge-test-support"]
resolver = "3"

[workspace.package]
version = "0.16.7"
edition = "2024"

[workspace.dependencies]
# workspace crates
agy-bridge = { path = "crates/agy-bridge", version = "0.16.7", default-features = false }
agy-bridge-test-support = { path = "crates/agy-bridge-test-support", default-features = false }
llm-tool = { version = "0.10.6" }
llm-tool-macros = { version = "0.10.6" }
md-tmpl = { version = "0.10.7" }

# runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
  "fs",
  "io-util",
] }
tokio-stream = "0.1"
futures = "0.3"

# python
pyo3 = { version = "0.29", features = ["auto-initialize"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# utilities
thiserror = "2"
tracing = "0.1"
base64 = "0.23"
typed-builder = "0.23"
fast_rands = "0.16"

# dev / testing
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# native backend
tokio-tungstenite = "0.30"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
